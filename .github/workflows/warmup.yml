# Keep hot API functions warm on Vercel so users don't hit the ~20s cold-start
# hydration (each serverless function pages the whole app_state_records table
# on boot). This is a STOPGAP — the data-core migration (docs/
# data-core-cure-plan.md) removes the root cause; delete this workflow once
# W2+W4 land.
name: warmup
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Ping hot endpoints
        run: |
          for path in \
            /api/health \
            /api/auth/session \
            /api/auth/login \
            /api/riders \
            /api/network \
            /api/overview \
            /api/dispatch \
            /api/mall \
            /api/rider/home \
            /api/tasks \
            /api/mall/ops \
            /api/mall/procurement \
            /api/wallet \
            /api/eastwind/riders-live \
            /api/points; do
            curl -s -o /dev/null -m 30 -w "%{http_code} %{time_total}s $path\n" "https://sys.meponto.com$path" || true
          done
