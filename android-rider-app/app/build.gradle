plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.gms.google-services'
}

// Release signing — credentials live in keystore.properties at the project root
// (git-ignored, never committed). Create it from keystore.properties.template.
// When the file is absent (e.g. CI without secrets), release stays unsigned and
// debug builds are unaffected.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.meponto.rider'
    // API 36 (Android 16): Play requires target API 36 for updates from
    // 2026-08-31 (console warning "Action by Aug 31").
    compileSdk 36

    defaultConfig {
        applicationId "com.meponto.rider"
        minSdk 24
        targetSdk 36
        versionCode 18
        versionName "2.5"
        vectorDrawables { useSupportLibrary true }

        // PontoSys backend base URL (overridable per build type).
        buildConfigField "String", "BASE_URL", "\"https://mall.meponto.com/api/\""

        // Google Sign-In Web client ID (same as NEXT_PUBLIC_GOOGLE_CLIENT_ID).
        // Set in gradle.properties: GOOGLE_WEB_CLIENT_ID=xxxxx.apps.googleusercontent.com
        // Empty = the Google button stays hidden (no risk if unconfigured).
        buildConfigField "String", "GOOGLE_WEB_CLIENT_ID", "\"${project.findProperty('GOOGLE_WEB_CLIENT_ID') ?: ''}\""
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
        }
        release {
            // Sign with the release key only when keystore.properties is present.
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
            // Keep R8 off for the first release: Moshi/Retrofit/Firebase rely on
            // reflection and would need extra keep-rules. Enable later with rules.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    // 2024.09.03 → Compose UI 1.7.x: needed for rememberGraphicsLayer
    // (member-card share-as-image capture).
    def composeBom = platform('androidx.compose:compose-bom:2024.09.03')
    implementation composeBom

    // Product images in PontoMall (async load + cache).
    implementation 'io.coil-kt:coil-compose:2.7.0'

    // Real street map (OpenStreetMap tiles — no API key, no Play dependency).
    implementation 'org.osmdroid:osmdroid-android:6.1.20'

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.2'

    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'

    // CameraX (real QR scanning) — 1.4.x ships 16 KB page-size compatible
    // native libs (libimage_processing_util_jni), required by Google Play.
    implementation 'androidx.camera:camera-core:1.4.2'
    implementation 'androidx.camera:camera-camera2:1.4.2'
    implementation 'androidx.camera:camera-lifecycle:1.4.2'
    implementation 'androidx.camera:camera-view:1.4.2'

    // ML Kit barcode scanning (on-device, no API key required) — 17.3.0 ships
    // a 16 KB-aligned libbarhopper_v3 (Play 16 KB page-size requirement).
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'

    // Transitive androidx.datastore ships libdatastore_shared_counter; pin a
    // 16 KB-compatible version (1.1.3+) to satisfy the Play requirement.
    implementation 'androidx.datastore:datastore-preferences:1.1.7'

    // ZXing — generate the rider's personal / invite QR codes (no API key)
    implementation 'com.google.zxing:core:3.5.3'

    // Firebase Cloud Messaging (push) — project "descuai", google-services.json in app/
    implementation platform('com.google.firebase:firebase-bom:34.15.0')
    implementation 'com.google.firebase:firebase-messaging'
    // Google Analytics (GA4) — feeds the existing "MePonto" Android stream in
    // the descuai property (screen/session auto-collection + key events).
    implementation 'com.google.firebase:firebase-analytics'

    // Networking — PontoSys API (Retrofit + Moshi + OkHttp)
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-moshi:2.11.0'
    implementation 'com.squareup.moshi:moshi:1.15.1'
    implementation 'com.squareup.moshi:moshi-kotlin:1.15.1'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // Sign in with Google (Credential Manager + Google ID token)
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'

    debugImplementation 'androidx.compose.ui:ui-tooling'
}
